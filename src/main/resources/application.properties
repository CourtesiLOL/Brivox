spring.application.name=Brivox
spring.application.version=0.0.1

server.port=8000
#server.address=TO-DO

spring.threads.virtual.enabled=true
logging.console.enabled=true

#ssl server config
server.ssl.key-store=classpath:server.p12
server.ssl.key-store-password=${ssl.server.pasword}
server.ssl.key-store-type=PKCS12

#Session config
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=60m

#JWT config
#jwt.secret.key=${security.jwt.secret-key}
#jwt.expire.time=${security.jwt.expire-length}

#TO-DO


spring.application.name=Brivox
spring.application.version=0.0.1

server.port=8000
#server.address=TO-DO

spring.threads.virtual.enabled=true
logging.console.enabled=true

#ssl server config
server.ssl.key-store=classpath:server.p12
server.ssl.key-store-password=${ssl.server.pasword}
server.ssl.key-store-type=PKCS12

#Session config
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=60m

#JWT config
#jwt.secret.key=${security.jwt.secret-key}
#jwt.expire.time=${security.jwt.expire-length}

#TO-DO

#DB config
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:brivox_db.sqlite

# Dialecto correcto para Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


#Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/views/
spring.thymeleaf.suffix=.xhtml
spring.thymeleaf.mode=XML

#Logs
logging.level.root=INFO

<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Authentication</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="stylesheet" href="/css/auth.css"/>
    </head>
    <body>
        <header>
            <h1 th:text="${form}" ></h1>
        </header>
        <main th:switch="${form}">
            <form th:case="'Register'" method="POST" th:action="@{/auth/register}">
                <input type="text" name="username" placeholder="User Name" required="required" />
                <input type="text" name="email" placeholder="Email" required="required" />
                <input type="password" name="password" placeholder="Password" required="required" />
                <input type="password" name="password2" placeholder="Repeat Password" required="required" />
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="submit" value="Register" />
            </form>

            <form th:case="*" method="POST" th:action="@{/auth}">
                <input type="text" name="email" placeholder="Email" required="required" />
                <input type="password" name="password" placeholder="Password" required="required" />
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="submit" value="Login" />
            </form>
        </main>
        <footer>

            <button th:if="${form == 'Login'}" onclick="location.href = '/auth?form=register'">Register</button>
            <button th:if="${form == 'Register'}" onclick="location.href = '/auth?form=login'">Login</button>

            <p th:if="${failed}" style="color:red;">
                Credenciales incorrectas. Inténtelo de nuevo.
            </p>
        </footer>
    </body>
</html>

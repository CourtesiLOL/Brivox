<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Authentication</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="stylesheet" href="/css/auth.css"/>
    </head>
    <body>
        <header>
            <h1 th:text="${form}"></h1>
        </header>
        <main>
            <form method="POST" action="/auth">
                <input type="text" name="username" placeholder="User" required />
                <input type="password" name="password" placeholder="Password" required />
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="submit" th:value="${form}" />
            </form>
        </main>
        <footer>
            <button th:if="${form == 'login'}" onclick="location.href='/auth?form=register'">register</button>
            <button th:if="${form == 'register'}" onclick="location.href='/auth?form=login'">login</button>
            <p style="color:red;" th:if="${failed}">
                Credenciales incorrectas. Inténtelo de nuevo.
            </p>
        </footer>
    </body>
</html>
